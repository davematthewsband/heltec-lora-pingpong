; Heltec WiFi LoRa 32 V3 (ESP32-S3 / SX1262)
[env:heltec_wifi_lora_32_V3]
platform = espressif32@6.6.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
lib_deps = heltecautomation/Heltec ESP32 Dev-Boards@2.1.7
build_flags =
    -D RADIO_CHIP_SX1262
    -D WIFI_LORA_32_V3
    -D HELTEC_BOARD=30
    -D SLOW_CLK_TPYE=0
    -D REGION_EU868
    -D ACTIVE_REGION=LORAMAC_REGION_EU868
    -D LoRaWAN_DEBUG_LEVEL=0
    ; Heltec radio C source includes an IDF header needing this legacy alias.
    -D GPIO_PIN_COUNT=SOC_GPIO_PIN_COUNT
